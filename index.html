
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>成长记录</title>

  <style>

    /* =========================
       页面背景
    ========================= */

    body {
      margin: 0;

      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }


    /* =========================
       视频
    ========================= */

    video {
      width: 90%;
      max-width: 700px;

      border-radius: 15px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.4);
    }


    /* =========================
       重播整体区域
       图片和气泡一起移动
    ========================= */

    #replayArea {
      display: none;

      position: fixed;

      /* =====================
         整体位置
         修改这里即可
      ===================== */

      left: 88%;
      top: 15%;

      /* ===================== */

      transform: translate(-50%, -50%);

      align-items: center;

      /* 图片和气泡之间距离 */
      gap: 0px;
    }


    /* =========================
       点我重播 气泡
    ========================= */

    #replayText {
      transform: translateX(80px) translateY(-35px);

      position: relative;

      font-size: 20px;
      font-weight: bold;

      color: #555;

      background:
        rgba(255,255,255,0.95);

      padding:
        12px 18px;

      border-radius: 18px;

      white-space: nowrap;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.15);

      cursor: pointer;
    }


    /* 气泡右边的小三角 */

    #replayText::after {
      content: "";

      position: absolute;

      right: -12px;
      top: 50%;

      transform:
        translateY(-50%);

      border-top:
        9px solid transparent;

      border-bottom:
        9px solid transparent;

      border-left:
        12px solid
        rgba(255,255,255,0.95);
    }


    /* =========================
       重新播放图片
    ========================= */

    #replayButton {

      /* =====================
         图片大小
         修改这里
      ===================== */

      width: 280px;
      height: 280px;

      /* ===================== */

      object-fit: contain;

      cursor: pointer;

      /* 保留原来的动画 */
      transition:
        transform 0.2s;
    }


    /* =========================
       鼠标放到图片上
       图片放大
    ========================= */

    #replayButton:hover {

      transform:
        scale(1.08);

    }



    /* =========================
       手机适配（不改变电脑原有效果）
       屏幕宽度 600px 以下才生效
    ========================= */
    @media (max-width: 600px) {

      body {
        /* 手机完整显示背景图，不裁切 */
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: scroll;

        /* 背景比例与手机不一致时的留白颜色 */
        background-color: #fff0f5;

        min-height: 100vh;
        min-height: 100svh;

        overflow: hidden;
      }

      /* 手机上的视频大小 */
      video {
        width: 94%;
        max-width: none;
        max-height: 72svh;
        border-radius: 12px;
      }

      /* 手机上的“气泡 + 重播图片”整体位置 */
      #replayArea {
        left: 50%;
        top: 20%;

        gap: 0px;
      }

      /* 手机上的重播图片大小 */
      #replayButton {
        width: 170px;
        height: 170px;
      }

      /* 手机上的气泡大小和相对位置 */
      #replayText {
        font-size: 14px;
        padding: 9px 13px;
        border-radius: 14px;

        /* 第一个数左右，第二个数上下 */
        transform: translateX(35px) translateY(-20px);
      }

      /* 手机上的气泡小三角 */
      #replayText::after {
        right: -10px;

        border-top-width: 7px;
        border-bottom-width: 7px;
        border-left-width: 10px;
      }
    }


    @media (max-width: 600px) {
      body::before,
      body::after {
        position: fixed;
        z-index: 0;
        pointer-events: none;
        font-size: 22px;
        line-height: 1.9;
        opacity: 0.65;
        white-space: pre;
      }

      body::before {
        content: "🌸  🌼\A   🌷\A 🌸   🌼";
        left: 8px;
        top: 8%;
      }

      body::after {
        content: "🌷   🌸\A  🌼\A 🌸  🌷";
        right: 8px;
        bottom: 8%;
        text-align: right;
      }

      video,
      #replayArea {
        position: relative;
        z-index: 1;
      }
    }

  </style>

</head>


<body>


  <!-- =========================
       视频
  ========================= -->

  <video
    id="myVideo"
    autoplay
    playsinline
    controls
    preload="metadata"
  >

    <source
      src="qianvideo1.mp4"
      type="video/mp4">

  </video>



  <!-- =========================
       视频结束后的区域
  ========================= -->

  <div id="replayArea">


    <!-- 点我重播气泡 -->

    <div
      id="replayText"
      onclick="replayVideo()"
    >

      点我重播

    </div>



    <!-- 原来的 replay 图片 -->

    <img
      id="replayButton"
      src="replay.png"
      alt="重新播放"
      onclick="replayVideo()"
    >


  </div>



  <script>


    /* ============================
       🔊 静音开关

       true  = 静音
       false = 有声音

       ↓↓↓ 只需要修改这里 ↓↓↓
    ============================ */

    const MUTE_VIDEO = true;



    /* ============================
       获取元素
    ============================ */

    const video =
      document.getElementById(
        "myVideo"
      );


    const replayArea =
      document.getElementById(
        "replayArea"
      );



    /* ============================
       设置静音
    ============================ */

    video.muted =
      MUTE_VIDEO;



    /* ============================
       尝试自动播放
    ============================ */

    video.play().catch(
      function() {

        console.log(
          "浏览器阻止了自动播放"
        );

      }
    );



    /* ============================
       视频播放结束
    ============================ */

    video.addEventListener(
      "ended",

      function() {


        /* 视频消失 */

        video.style.display =
          "none";


        /* 图片 + 气泡出现 */

        replayArea.style.display =
          "flex";


      }
    );



    /* ============================
       点击重新播放
    ============================ */

    function replayVideo() {


      /* 图片 + 气泡消失 */

      replayArea.style.display =
        "none";


      /* 视频重新出现 */

      video.style.display =
        "block";


      /* 回到视频开头 */

      video.currentTime = 0;


      /* 播放 */

      video.play();


    }


  </script>


</body>
