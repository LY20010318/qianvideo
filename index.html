<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>成长记录</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }


    /* =========================
       页面背景（电脑）
    ========================= */

    body {
      margin: 0;

      background-image: url("background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #fff0f5;

      min-height: 100vh;
      min-height: 100svh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }


    /* =========================
       视频
    ========================= */

    video {
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      max-height: 85svh;

      border-radius: 15px;

      box-shadow:
        0 10px 35px
        rgba(0,0,0,0.4);

      object-fit: contain;
      background: #000;

      /*
        对部分安卓浏览器的视频合成层更稳一些
      */
      -webkit-transform: translateZ(0);
      transform: translateZ(0);

      position: relative;
      z-index: 2;
    }


    /* =========================
       重播整体区域
       保留你原来的位置
    ========================= */

    #replayArea {
      display: none;

      position: fixed;

      /* 你原来的整体位置 */
      left: 88%;
      top: 15%;

      transform: translate(-50%, -50%);

      align-items: center;

      /* 图片和气泡之间距离 */
      gap: 0px;

      z-index: 20;
    }


    /* =========================
       点我重播 气泡
       保留你原来的效果
    ========================= */

    #replayText {
      transform: translateX(80px) translateY(-35px);

      position: relative;

      font-size: 20px;
      font-weight: bold;

      color: #555;

      background:
        rgba(255,255,255,0.95);

      padding:
        12px 18px;

      border-radius: 18px;

      white-space: nowrap;

      box-shadow:
        0 5px 20px
        rgba(0,0,0,0.15);

      cursor: pointer;

      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }


    /* 气泡右边的小三角 */

    #replayText::after {
      content: "";

      position: absolute;

      right: -12px;
      top: 50%;

      transform:
        translateY(-50%);

      border-top:
        9px solid transparent;

      border-bottom:
        9px solid transparent;

      border-left:
        12px solid
        rgba(255,255,255,0.95);
    }


    /* =========================
       重新播放图片
       保留你原来的大小
    ========================= */

    #replayButton {
      width: 280px;
      height: 280px;

      object-fit: contain;

      cursor: pointer;

      /* 保留原来的动画 */
      transition:
        transform 0.2s;

      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }


    /* =========================
       鼠标放到图片上
       图片放大
    ========================= */

    #replayButton:hover {
      transform:
        scale(1.08);
    }


    /* =========================
       手机适配
       只调整背景和视频
       不改 replay 原来的位置/大小
    ========================= */

    @media (max-width: 600px) {

      body {
        /*
          contain = 整张背景图完整显示
          图片比例和手机不同时会留空白
        */
        background-size: contain;
        background-position: center center;
        background-repeat: no-repeat;

        /*
          iPhone / 国产安卓浏览器对 fixed 背景支持不一致，
          手机端改成 scroll 更稳定
        */
        background-attachment: scroll;

        /*
          空白区域的底色
        */
        background-color: #fff0f5;

        min-height: 100vh;
        min-height: 100svh;
      }


      /* 手机上的视频只调整大小 */

      video {
        width: 94%;
        max-width: none;

        max-height: 72vh;
        max-height: 72svh;

        border-radius: 12px;
      }


      /* =========================
         📱 手机重新播放区域
         以后只改这里的两个数字：
         left = 左右
         top  = 上下
      ========================= */

      #replayArea {
        left: 50%;
        top:  15%;
      }



      /* =========================
         粉色小花装饰
      ========================= */

      body::before,
      body::after {
        position: fixed;

        z-index: 1;

        pointer-events: none;

        font-size: 20px;
        line-height: 1.9;

        opacity: 0.60;

        white-space: pre;
      }


      body::before {
        content:
          "🌸   🌼\A"
          "   🌷\A"
          "🌸   🌼";

        left: 8px;
        top: 7%;
      }


      body::after {
        content:
          "🌷   🌸\A"
          " 🌼   \A"
          "🌸   🌷";

        right: 8px;
        bottom: 7%;

        text-align: right;
      }

    }
    }

  </style>

</head>


<body>


  <!-- =========================
       视频

       兼容：
       Safari / Chrome / Edge
       华为 / 荣耀 / 小米 / OPPO / vivo
       百度 / 微信 / QQ 等常见内置浏览器

       注意：
       各厂商不同系统版本仍可能存在差异，
       H5 无法保证所有版本完全一致。
  ========================= -->

  <video
    id="myVideo"

    autoplay

    playsinline
    webkit-playsinline

    x5-playsinline
    x5-video-player-type="h5-page"
    x5-video-player-fullscreen="false"

    controls
    preload="metadata"
  >

    <source
      src="qianvideo1.mp4"
      type="video/mp4">

    你的浏览器不支持视频播放。

  </video>



  <!-- =========================
       视频结束后的区域
  ========================= -->

  <div id="replayArea">


    <!-- 点我重播气泡 -->

    <div
      id="replayText"
      role="button"
      tabindex="0"
      onclick="replayVideo()"
    >

      点我重播

    </div>



    <!-- 原来的 replay 图片 -->

    <img
      id="replayButton"
      src="replay.png"
      alt="重新播放"
      draggable="false"
      onclick="replayVideo()"
    >


  </div>



  <script>


    /* ============================
       🔊 静音开关

       true  = 静音
       false = 有声音

       自动播放时推荐 true。
       很多浏览器会阻止“有声音自动播放”。
    ============================ */

    const MUTE_VIDEO = true;



    /* ============================
       获取元素
    ============================ */

    const video =
      document.getElementById(
        "myVideo"
      );


    const replayArea =
      document.getElementById(
        "replayArea"
      );


    const replayText =
      document.getElementById(
        "replayText"
      );



    /* ============================
       增强内联播放兼容
    ============================ */

    video.setAttribute(
      "playsinline",
      ""
    );

    video.setAttribute(
      "webkit-playsinline",
      ""
    );

    video.setAttribute(
      "x5-playsinline",
      ""
    );



    /* ============================
       设置静音
    ============================ */

    video.muted =
      MUTE_VIDEO;

    video.defaultMuted =
      MUTE_VIDEO;



    /* ============================
       尝试自动播放
    ============================ */

    function tryAutoPlay() {

      const playPromise =
        video.play();


      if (
        playPromise &&
        typeof playPromise.catch === "function"
      ) {

        playPromise.catch(
          function() {

            console.log(
              "浏览器阻止了自动播放"
            );

          }
        );

      }

    }



    /*
      DOM 准备好以后尝试播放
    */

    if (
      document.readyState === "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        tryAutoPlay
      );

    } else {

      tryAutoPlay();

    }



    /* ============================
       视频播放时
       确保 replay 区域隐藏
    ============================ */

    video.addEventListener(
      "play",

      function() {

        replayArea.style.display =
          "none";

      }
    );



    /* ============================
       强制隐藏视频

       主要针对：
       百度 App / 部分国产安卓浏览器
       视频结束后仍残留播放框的问题
    ============================ */

    function hideVideoCompletely() {

      video.pause();

      video.controls =
        false;


      /*
        多种隐藏方式一起使用，
        避免某些浏览器的视频层残留
      */

      video.style.display =
        "none";

      video.style.visibility =
        "hidden";

      video.style.opacity =
        "0";

      video.style.width =
        "0px";

      video.style.height =
        "0px";

      video.style.maxWidth =
        "0px";

      video.style.maxHeight =
        "0px";

      video.style.pointerEvents =
        "none";

    }



    /* ============================
       恢复视频
    ============================ */

    function showVideoAgain() {

      video.style.display =
        "block";

      video.style.visibility =
        "visible";

      video.style.opacity =
        "1";

      video.style.width =
        "";

      video.style.height =
        "";

      video.style.maxWidth =
        "";

      video.style.maxHeight =
        "";

      video.style.pointerEvents =
        "auto";

      video.controls =
        true;

    }



    /* ============================
       视频播放结束
    ============================ */

    video.addEventListener(
      "ended",

      function() {

        hideVideoCompletely();


        /*
          下一帧再显示 replay，
          对部分安卓浏览器更稳定
        */

        requestAnimationFrame(
          function() {

            replayArea.style.display =
              "flex";

          }
        );

      }
    );



    /* ============================
       点击重新播放
    ============================ */

    function replayVideo() {


      /* 图片 + 气泡消失 */

      replayArea.style.display =
        "none";


      /* 恢复视频 */

      showVideoAgain();


      /* 回到开头 */

      try {

        video.currentTime =
          0;

      } catch (e) {

        console.log(
          "无法立即跳回视频开头",
          e
        );

      }


      /* 重新播放 */

      const playPromise =
        video.play();


      if (
        playPromise &&
        typeof playPromise.catch === "function"
      ) {

        playPromise.catch(
          function() {

            console.log(
              "浏览器阻止了重新播放"
            );

          }
        );

      }

    }



    /* ============================
       气泡键盘操作
       电脑端也可以按 Enter / 空格重播
    ============================ */

    replayText.addEventListener(
      "keydown",

      function(event) {

        if (
          event.key === "Enter" ||
          event.key === " "
        ) {

          event.preventDefault();

          replayVideo();

        }

      }
    );



    /* ============================
       页面切到后台时暂停
       减少部分手机浏览器异常占用
    ============================ */

    document.addEventListener(
      "visibilitychange",

      function() {

        if (
          document.hidden &&
          !video.ended
        ) {

          video.pause();

        }

      }
    );


  </script>


</body>

</html>
